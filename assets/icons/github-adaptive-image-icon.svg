<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Adaptive image scanning icon</title>
  <desc id="desc">Transparent purple image icon optimized for GitHub light and dark themes.</desc>

  <defs>
    <linearGradient id="purple" x1="88" y1="68" x2="424" y2="444" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.52" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="purpleDark" x1="104" y1="400" x2="394" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <style>
    .outline { stroke: #4C1D95; }
    .corner { stroke: #6D28D9; }
    @media (prefers-color-scheme: dark) {
      .outline { stroke: #EDE9FE; }
      .corner { stroke: #A78BFA; }
    }
  </style>

  <!-- Transparent background: no background rectangle. -->
  <g class="corner" fill="none" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path d="M92 174V112a20 20 0 0 1 20-20h62"/>
    <path d="M338 92h62a20 20 0 0 1 20 20v62"/>
    <path d="M420 338v62a20 20 0 0 1-20 20h-62"/>
    <path d="M174 420h-62a20 20 0 0 1-20-20v-62"/>
  </g>

  <circle class="outline" cx="329" cy="207" r="45" fill="none" stroke-width="18"/>

  <path class="outline" d="M137 354 222 247a18 18 0 0 1 28-1l57 70 34-39a18 18 0 0 1 27 0l50 58c11 13 2 33-15 33H153c-15 0-25-18-16-30Z"
        fill="url(#purple)" stroke-width="18" stroke-linejoin="round"/>
  <path d="m274 275 33 41 34-39a18 18 0 0 1 27 0l50 58c11 13 2 33-15 33h-62Z"
        fill="url(#purpleDark)" opacity=".9"/>
</svg>
