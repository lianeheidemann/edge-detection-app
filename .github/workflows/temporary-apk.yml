name: Temporary APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/interface-apk-test

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore missing Android project files
        run: flutter create --platforms=android --project-name detector_de_bordas2 .

      - name: Install dependencies
        run: flutter pub get

      - name: Format source for the runner
        run: dart format lib

      - name: Analyze source code
        run: flutter analyze

      - name: Build temporary APK
        run: flutter build apk --debug

      - name: Upload temporary APK
        uses: actions/upload-artifact@v4
        with:
          name: edge-detection-app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
